name: Reusable Checks

on:
  workflow_call:
    inputs:
      language:
        description: "python or node"
        required: false
        type: string
        default: python
      working-directory:
        required: false
        type: string
        default: "."
      max-retries:
        required: false
        type: number
        default: 3
      escalate-after:
        description: "consecutive failures before filing/escalating an issue"
        required: false
        type: number
        default: 3
      advisory:
        description: "Allow checks to report evidence without failing the caller. Keep false for production gates."
        required: false
        type: boolean
        default: false
    outputs:
      evidence-status:
        description: "Machine-readable evidence gate result: passed or failed"
        value: ${{ jobs.lint-test-build.outputs.evidence-status }}
      evidence-summary:
        description: "Compact evidence summary for downstream orchestration"
        value: ${{ jobs.lint-test-build.outputs.evidence-summary }}

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      evidence-status: ${{ steps.aggregate.outputs.status }}
      evidence-summary: ${{ steps.aggregate.outputs.summary }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Setup Node
        if: inputs.language == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install deps (python, with retry)
        id: install-python
        if: inputs.language == 'python'
        continue-on-error: ${{ inputs.advisory }}
        uses: ./.github/actions/retry-step
        with:
          working-directory: ${{ inputs.working-directory }}
          max-attempts: ${{ inputs.max-retries }}
          command: |
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
            elif [ -f pyproject.toml ]; then
              pip install -e .
            else
              echo "::error::Python project has neither requirements.txt nor pyproject.toml"
              exit 1
            fi

      - name: Install deps (node, with retry)
        id: install-node
        if: inputs.language == 'node'
        continue-on-error: ${{ inputs.advisory }}
        uses: ./.github/actions/retry-step
        with:
          working-directory: ${{ inputs.working-directory }}
          max-attempts: ${{ inputs.max-retries }}
          command: "npm ci"

      - name: Lint
        id: lint
        continue-on-error: ${{ inputs.advisory }}
        run: |
          set -o pipefail
          if [ "${{ inputs.language }}" = "python" ]; then
            pip install ruff
            ruff check .
          else
            npx eslint .
          fi

      - name: Test (with retry for flaky suites)
        id: test
        continue-on-error: ${{ inputs.advisory }}
        uses: ./.github/actions/retry-step
        with:
          working-directory: ${{ inputs.working-directory }}
          max-attempts: ${{ inputs.max-retries }}
          command: |
            if [ "${{ inputs.language }}" = "python" ]; then pytest -q; else npm test --silent; fi

      - name: Static validation
        id: static
        continue-on-error: ${{ inputs.advisory }}
        run: |
          if [ "${{ inputs.language }}" = "python" ]; then
            python -m compileall -q .
          else
            npx tsc --noEmit --pretty false
          fi

      - name: Build
        id: build
        continue-on-error: ${{ inputs.advisory }}
        run: |
          if [ "${{ inputs.language }}" = "node" ] && [ -f package.json ]; then
            npm run build --if-present
          fi

      - name: Aggregate evidence
        id: aggregate
        if: always()
        env:
          LANGUAGE: ${{ inputs.language }}
          PYTHON_INSTALL_OUTCOME: ${{ steps.install-python.outcome }}
          NODE_INSTALL_OUTCOME: ${{ steps.install-node.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ADVISORY: ${{ inputs.advisory }}
        run: |
          if [ "$LANGUAGE" = "python" ]; then
            install_outcome="$PYTHON_INSTALL_OUTCOME"
          else
            install_outcome="$NODE_INSTALL_OUTCOME"
          fi

          status=passed
          for outcome in "$install_outcome" "$LINT_OUTCOME" "$TEST_OUTCOME" "$STATIC_OUTCOME" "$BUILD_OUTCOME"; do
            if [ "$outcome" != "success" ]; then status=failed; fi
          done

          summary="{\"install\":\"$install_outcome\",\"lint\":\"$LINT_OUTCOME\",\"test\":\"$TEST_OUTCOME\",\"static\":\"$STATIC_OUTCOME\",\"build\":\"$BUILD_OUTCOME\",\"advisory\":$ADVISORY,\"status\":\"$status\"}"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$summary" > evidence-summary.json

      - name: Upload evidence summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-summary
          path: ${{ inputs.working-directory }}/evidence-summary.json
          retention-days: 14

      - name: Escalate on repeated failure
        if: steps.aggregate.outputs.status == 'failed'
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const escalateAfter = ${{ inputs.escalate-after }};
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner, repo: context.repo.repo, per_page: escalateAfter, branch: context.ref.replace('refs/heads/',''),
            });
            const recent = runs.data.workflow_runs.filter(r => r.name === context.workflow).slice(0, escalateAfter);
            const consecutiveFailures = recent.length === escalateAfter && recent.every(r => r.conclusion === 'failure');
            if (consecutiveFailures) {
              const title = `CI failing ${escalateAfter}x in a row on ${context.ref}`;
              const issues = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'ci-failure' });
              if (issues.data.find(i => i.title === title) === undefined) {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title, labels: ['ci-failure'],
                  body: `Automated escalation: this workflow has failed ${escalateAfter} consecutive times on \`${context.ref}\`. See run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
                });
              }
            }

      - name: Fail job if evidence gate failed
        if: steps.aggregate.outputs.status == 'failed' && !inputs.advisory
        run: exit 1
