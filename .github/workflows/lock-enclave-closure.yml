name: Lock enclave — Closure Engine

on:
  pull_request:
    branches: [main]
    paths:
      - 'enclave/closure-engine/**'
      - '.github/workflows/lock-enclave-closure.yml'

permissions:
  contents: read

concurrency:
  group: lock-enclave-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: enclave/closure-engine
    steps:
      - name: Checkout enclave candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: enclave/closure-engine/package.json

      - name: Pin npm authority
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Generate package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Prove frozen install consumes generated lock
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Report lock identity
        run: |
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion!==3) process.exit(2); console.log(JSON.stringify({lockfileVersion:p.lockfileVersion,packages:Object.keys(p.packages||{}).length}))"
          sha256sum package.json package-lock.json

      - name: Upload generated lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: closure-engine-package-lock
          path: enclave/closure-engine/package-lock.json
          if-no-files-found: error
          retention-days: 1
