name: Lock enclave — Closure Engine

on:
  pull_request:
    branches: [main]
    paths:
      - 'enclave/closure-engine/**'
      - '.github/workflows/lock-enclave-closure.yml'

permissions:
  contents: read

concurrency:
  group: lock-enclave-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prove-and-export-cache:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: enclave/closure-engine
    steps:
      - name: Checkout exact enclave head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      - name: Pin npm authority
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Bind persisted lock to audited authority
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const expectedManifest = '5a1571c50a1bc0e27aa95f670db991e523f446bbda8aa2413888dd78ed3ded68';
          const expectedLock = '30c912f9e6230de6786dc04760951b2da98850a7f00fa18b6e2f11da9b5a4bcc';
          const digest = (path) => crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          if (digest('package.json') !== expectedManifest) throw new Error('manifest identity drifted');
          if (digest('package-lock.json') !== expectedLock) throw new Error('lock identity drifted');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages && lock.packages[''];
          const entries = (value) => Object.entries(value || {}).sort(([a], [b]) => a.localeCompare(b));
          if (lock.lockfileVersion !== 3 || !root) throw new Error('lock is not a root-bearing v3 lock');
          for (const section of ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies']) {
            if (JSON.stringify(entries(manifest[section])) !== JSON.stringify(entries(root[section]))) {
              throw new Error(`lock root does not match package.json ${section}`);
            }
          }
          console.log('audited manifest/lock authority: PASS');
          NODE

      - name: Reset cache to exact graph only
        run: npm cache clean --force

      - name: Prove frozen install and warm exact cache
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reject high or critical dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify and package exact npm cache
        run: |
          npm cache verify
          tar -czf closure-engine-npm-cache.tgz -C "$HOME/.npm" _cacache
          sha256sum closure-engine-npm-cache.tgz
          wc -c closure-engine-npm-cache.tgz

      - name: Upload exact npm cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: closure-engine-npm-cache-linux-x64
          path: enclave/closure-engine/closure-engine-npm-cache.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
